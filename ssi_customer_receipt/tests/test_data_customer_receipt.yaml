setup:
  steps:
    - step: "Create customer partner"
      action: "create"
      model: "res.partner"
      save_as: "customer"
      values:
        name: "Test Customer Receipt Partner"
        is_company: true

    - step: "Create bank journal"
      action: "create"
      model: "account.journal"
      save_as: "journal"
      values:
        name: "Test Customer Receipt Bank Journal"
        type: "bank"

    - step: "Create second bank journal"
      action: "create"
      model: "account.journal"
      save_as: "journal_2"
      values:
        name: "Test Customer Receipt Bank Journal 2"
        type: "bank"

scenarios:
  - name: "Create Customer Receipt forces inbound customer defaults"
    steps:
      - step: "Create receipt without payment/partner type"
        action: "create"
        model: "customer_receipt"
        save_as: "receipt"
        values:
          partner_id: "REC: customer.id"
          amount: 150000.0
          journal_id: "REC: journal.id"

      - step: "Assert defaults applied"
        action: "assert"
        target: "receipt"
        asserts:
          payment_type:
            type: "value"
            expected: "inbound"
          partner_type:
            type: "value"
            expected: "customer"
          state:
            type: "value"
            expected: "draft"

  - name: "Global rule hides vendor payment from Customer Receipt"
    steps:
      - step: "Create vendor partner"
        action: "create"
        model: "res.partner"
        save_as: "vendor"
        values:
          name: "Test Vendor Payment Partner"
          is_company: true

      - step: "Create vendor payment via account.payment"
        action: "create"
        model: "account.payment"
        save_as: "vendor_payment"
        values:
          payment_type: "outbound"
          partner_type: "supplier"
          partner_id: "REC: vendor.id"
          amount: 200000.0
          journal_id: "REC: journal.id"

      - step: "Create customer receipt via customer_receipt"
        action: "create"
        model: "customer_receipt"
        save_as: "receipt"
        values:
          partner_id: "REC: customer.id"
          amount: 175000.0
          journal_id: "REC: journal.id"

      - step: "Vendor payment is not visible through customer_receipt"
        action: "search"
        model: "customer_receipt"
        as_user: "base.user_admin"
        domain:
          - ["id", "=", "REC: vendor_payment.id"]
        save_as: "found_vendor"
        expect_count: 0

      - step: "Customer receipt is visible through customer_receipt"
        action: "search"
        model: "customer_receipt"
        as_user: "base.user_admin"
        domain:
          - ["id", "=", "REC: receipt.id"]
        save_as: "found_receipt"
        expect_count: 1

  - name: "Inherited workflow methods post and reset to draft"
    steps:
      - step: "Create receipt"
        action: "create"
        model: "customer_receipt"
        save_as: "receipt"
        values:
          partner_id: "REC: customer.id"
          amount: 125000.0
          journal_id: "REC: journal.id"

      - step: "Assert draft"
        action: "assert"
        target: "receipt"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Post receipt"
        action: "call"
        target: "receipt"
        method: "action_post"
        as_user: "base.user_admin"

      - step: "Invalidate cache after post"
        action: "call"
        target: "receipt"
        method: "invalidate_cache"

      - step: "Assert posted"
        action: "assert"
        target: "receipt"
        asserts:
          state:
            type: "value"
            expected: "posted"

      - step: "Reset receipt to draft"
        action: "call"
        target: "receipt"
        method: "action_draft"
        as_user: "base.user_admin"

      - step: "Invalidate cache after draft"
        action: "call"
        target: "receipt"
        method: "invalidate_cache"

      - step: "Assert back to draft"
        action: "assert"
        target: "receipt"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Create overrides forced vendor values back to customer receipt"
    steps:
      - step: "Create receipt trying to force outbound supplier"
        action: "create"
        model: "customer_receipt"
        save_as: "receipt"
        values:
          payment_type: "outbound"
          partner_type: "supplier"
          partner_id: "REC: customer.id"
          amount: 90000.0
          journal_id: "REC: journal.id"

      - step: "Assert create() forced inbound customer"
        action: "assert"
        target: "receipt"
        asserts:
          payment_type:
            type: "value"
            expected: "inbound"
          partner_type:
            type: "value"
            expected: "customer"

  - name: "Restricted user (no account.move ACL) can create and post receipt via sudo"
    options: {auto_refresh: true}
    steps:
      - step: "Create restricted customer-receipt user (no account.move ACL)"
        action: "create"
        model: "res.users"
        save_as: "receipt_user"
        values:
          name: "Receipt Only User"
          login: "receipt_only_user"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_financial_accounting.customer_payment_user_group"
                - "REF: ssi_financial_accounting.customer_payment_company_group"

      - step:
          "Create receipt as restricted user -> must succeed (sudo materializes
          account.move)"
        action: "create"
        model: "customer_receipt"
        as_user: "receipt_user"
        save_as: "receipt"
        values:
          partner_id: "REC: customer.id"
          amount: 250000.0
          journal_id: "REC: journal.id"

      - step: "Assert draft + a delegated account.move was created"
        action: "assert"
        target: "receipt"
        asserts:
          state:
            type: "value"
            expected: "draft"
          move_id:
            type: "value"
            operator: "is_truthy"

      - step: "Assert audit kept: sudo() in v14 keeps the real user as create_uid"
        action: "assert"
        target: "receipt"
        asserts:
          create_uid:
            type: "m2o"
            expected: "REC: receipt_user"
          move_id.create_uid:
            type: "m2o"
            expected: "REC: receipt_user"

      - step: "Post receipt as restricted user -> must succeed (posts account.move)"
        action: "call"
        target: "receipt"
        method: "action_post"
        as_user: "receipt_user"

      - step: "Assert posted"
        action: "assert"
        target: "receipt"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "posted"

  - name: "Standalone views: no inherit_id, mode primary (issue #12)"
    steps:
      - step: "Get form view"
        action: "ref"
        xml_id: "ssi_customer_receipt.customer_receipt_view_form"
        save_as: "view_form"

      - step: "Get tree view"
        action: "ref"
        xml_id: "ssi_customer_receipt.customer_receipt_view_tree"
        save_as: "view_tree"

      - step: "Get search view"
        action: "ref"
        xml_id: "ssi_customer_receipt.customer_receipt_view_search"
        save_as: "view_search"

      - step: "Assert form view is a standalone primary fork"
        action: "assert"
        target: "view_form"
        asserts:
          inherit_id:
            type: "value"
            operator: "is_falsy"
          mode:
            type: "value"
            expected: "primary"

      - step: "Assert tree view is a standalone primary fork"
        action: "assert"
        target: "view_tree"
        asserts:
          inherit_id:
            type: "value"
            operator: "is_falsy"
          mode:
            type: "value"
            expected: "primary"

      - step: "Assert search view is a standalone primary fork"
        action: "assert"
        target: "view_search"
        asserts:
          inherit_id:
            type: "value"
            operator: "is_falsy"
          mode:
            type: "value"
            expected: "primary"

  - name: "Manual destination account survives save when set after the journal"
    steps:
      - step: "Create manual receivable account (T-16: reconcile required)"
        action: "create"
        model: "account.account"
        save_as: "receivable_account_2"
        values:
          name: "Test Customer Receipt Manual Receivable"
          code: "TCR-REC-2"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Fill partner, journal, then override the destination account manually"
        action: "form"
        model: "customer_receipt"
        save_as: "receipt_manual_account"
        values:
          partner_id: "REC: customer"
          journal_id: "REC: journal"
          destination_account_id: "REC: receivable_account_2"
          amount: 300000.0
        asserts:
          destination_account_id:
            type: "m2o"
            expected: "REC: receivable_account_2"
        save: true

      - step: "Assert the manual account persisted after save"
        action: "assert"
        target: "receipt_manual_account"
        asserts:
          destination_account_id:
            type: "m2o"
            expected: "REC: receivable_account_2"

  - name:
      "Changing the journal after setting the account resets it to core's computed value"
    steps:
      - step: "Create a second manual receivable account (T-16: reconcile required)"
        action: "create"
        model: "account.account"
        save_as: "receivable_account_3"
        values:
          name: "Test Customer Receipt Manual Receivable 2"
          code: "TCR-REC-3"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Set journal, override the account, then change the journal again"
        action: "form"
        model: "customer_receipt"
        save: false
        ops:
          - set: {partner_id: "REC: customer"}
          - set: {journal_id: "REC: journal"}
          - set: {destination_account_id: "REC: receivable_account_3"}
          - set: {journal_id: "REC: journal_2"}
          - assert:
              destination_account_id:
                type: "m2o"
                expected: "REC: customer.property_account_receivable_id"
